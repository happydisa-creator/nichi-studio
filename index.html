<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nichi Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fff6f1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nichi Studio">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff6f1;--sf:#fffbf8;--mu:#f6e4de;--pk:#f9c9cb;--ps:#f58f95;--pt:#d9575f;--br:#5a3e3a;--bs:#9a807a;--ol:#ebd8d1;--sh:rgba(120,70,60,.14);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a201f;--sf:#352827;--mu:#44332f;--pk:#5c3a3d;--ps:#f58f95;--pt:#ffb3b8;--br:#f3e3de;--bs:#b79d97;--ol:#53423f;--sh:rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a201f;--sf:#352827;--mu:#44332f;--pk:#5c3a3d;--ps:#f58f95;--pt:#ffb3b8;--br:#f3e3de;--bs:#b79d97;--ol:#53423f;--sh:rgba(0,0,0,.35);color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--br);font-family:'Quicksand',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{display:flex;height:100%}
#nav{display:flex;flex-direction:column;gap:6px;width:88px;padding:14px 8px;background:var(--sf);border-right:1px solid var(--ol);flex:none}
#nav .logo{text-align:center;font-weight:700;font-size:13px;margin-bottom:10px}
#nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:18px;font-size:11px;color:var(--br)}
#nav button span{display:flex}
#nav button.on{background:var(--pk);color:var(--pt)}
#main{flex:1;min-width:0;overflow-y:auto;padding:16px 20px 110px}
.v-canvas #nav{display:none}.v-canvas #main{padding:0;overflow:hidden}
h1,h2,p{margin:0}h1{font-size:24px}h2{font-size:26px}
small,.sub{color:var(--bs);font-size:12px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;margin-bottom:14px}
#q{flex:1;min-width:160px;max-width:340px;height:42px;border-radius:21px;border:0;background:var(--mu);padding:0 16px;outline:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.seg{display:flex;gap:2px;padding:4px;border-radius:24px;background:var(--sf);border:1px solid var(--ol)}
.seg button{width:44px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center}.seg .on{background:var(--pk)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{flex:none;padding:7px 16px;border-radius:20px;background:var(--sf);border:1px solid var(--ol);white-space:nowrap}
.chip.on{background:var(--pk);border-color:var(--pk);color:var(--pt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.grid.list{grid-template-columns:1fr}
.card{background:var(--sf);border-radius:18px;box-shadow:0 3px 10px var(--sh);overflow:hidden;cursor:pointer;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.cover{position:relative;aspect-ratio:.82;display:flex;align-items:center;justify-content:center;font-size:54px}
.list .card{display:flex;align-items:center}.list .cover{width:70px;aspect-ratio:.85;font-size:32px;flex:none}
.badge{position:absolute;top:8px;left:8px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:12px;background:var(--pk);color:var(--pt)}
.card .meta{padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:6px}.list .card .meta{flex:1}.card b{font-weight:600}.card small{display:block;margin-top:2px}
.fab{position:fixed;right:22px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ps);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px var(--sh)}
.sec{background:var(--sf);border:1px solid var(--ol);border-radius:24px;padding:16px;margin-bottom:14px}
.sec h3{margin:0 0 12px;font-size:16px}
.cols{display:grid;grid-template-columns:1fr 250px;gap:14px}
.hs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.sz{flex:none;width:108px;padding:10px;border-radius:18px;border:1px solid var(--ol);background:var(--sf);text-align:center;position:relative}
.sz.on,.tp.on{background:color-mix(in srgb,var(--pk) 55%,transparent);border:2px solid var(--ps)}
.sz i{display:block;height:64px;position:relative}.sz i u{position:absolute;inset:0;margin:auto;border:1.5px solid var(--bs);border-radius:4px}
.sz small{display:block;font-size:10px}.sz b{font-size:12px}
.sz input{width:42px;border-radius:8px;border:1px solid var(--ol);background:var(--mu);padding:3px;text-align:center}
.tp{flex:none;width:112px;padding:8px;border-radius:16px;border:1px solid var(--ol);background:var(--sf);text-align:center;font-size:12px}
.tp i{display:flex;aspect-ratio:.78;border-radius:10px;align-items:center;justify-content:center;font-size:32px;margin-bottom:6px;font-style:normal}
.pv{display:flex;align-items:center;justify-content:space-between}
.pv button{font-size:22px;padding:6px}
.pv canvas{width:100px;height:130px;border-radius:12px;border:1px solid var(--ol)}
.dots{display:flex;justify-content:space-around;margin-top:10px}
.dots button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ol)}.dots .on{border:3px solid var(--ps)}
.adv{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-end}
.adv label{display:block;margin-bottom:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;border:1px solid var(--ol);background:var(--sf);margin-right:6px}
.pill.on{background:var(--pk);border-color:var(--pk);color:var(--pt)}
select{padding:8px 12px;border-radius:14px;border:1px solid var(--ol);background:var(--mu)}
.go{height:56px;padding:0 36px;border-radius:28px;background:var(--pk);color:var(--pt);font-size:17px;font-weight:700;box-shadow:0 4px 12px var(--sh)}
.bar{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.bar .t{flex:1}.ic{width:42px;height:42px;border-radius:50%;background:var(--sf);border:1px solid var(--ol);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic:disabled{opacity:.35}
.cv{display:flex;flex-direction:column;height:100%}
.cv .bar{padding:12px 12px 0;margin:0}
#stage{overflow:hidden;touch-action:none;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:10px}
#cv{border-radius:12px;touch-action:none;cursor:crosshair}
.panel{margin:0 12px 12px;padding:10px 12px;background:var(--sf);border-radius:22px;box-shadow:0 5px 16px var(--sh);display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:center}
.tl{display:flex;gap:4px}.tl button{padding:6px 12px;border-radius:14px;font-size:11px}.tl button span{display:flex;justify-content:center;margin-bottom:2px}.tl .on{background:var(--pk);color:var(--pt)}
.cl{display:flex;gap:8px}.cl button{width:28px;height:28px;border-radius:50%;border:1px solid var(--ol)}.cl .on{border:3px solid var(--ps)}
.sl{display:flex;align-items:center;gap:8px}.sl input{accent-color:var(--ps)}.pd{width:30px;display:flex;justify-content:center}.pd b{border-radius:50%;display:block}
.ph{display:flex;height:60%;align-items:center;justify-content:center;color:var(--bs)}
.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.t .i,h1 .i,h3 .i,.logo .i{color:var(--ps);vertical-align:-3px;width:1.1em;height:1.1em}
#nav button .i{width:24px;height:24px}.seg .i{width:20px;height:20px}.fab .i{width:28px;height:28px;stroke-width:2.4}
.pill .i{width:16px;height:16px}.x .i{width:18px;height:18px}.tl .i{width:22px;height:22px}
.card small.cl2{display:flex;align-items:center;gap:4px}.cl2 .i{width:12px;height:12px}
.hrt{color:var(--ps);display:inline-flex;vertical-align:-2px}.hrt .i{width:13px;height:13px;fill:currentColor}
.book{will-change:transform;padding:6px;border-radius:18px;background:#e8cdb8;box-shadow:0 8px 22px var(--sh);line-height:0}
.cv .bar.top{padding:12px 12px 0;gap:10px;flex-wrap:wrap;margin:0}
.tb{display:flex;align-items:center;gap:4px;padding:4px 10px;border-radius:30px;background:var(--sf);box-shadow:0 3px 12px var(--sh);flex:1;min-width:0;overflow-x:auto;justify-content:safe center}
.tb .sp{width:1px;height:28px;background:var(--ol);margin:0 6px;flex:none}.tb .ic{width:36px;height:36px;border:0;background:none}
.tb .tl button{flex:none}.tb .tl button.off{opacity:.4;cursor:default}
.zm{display:inline-flex;align-items:center;gap:4px;padding:8px 14px;border-radius:20px;background:var(--sf);box-shadow:0 2px 8px var(--sh);cursor:pointer}.zm .i{width:14px;height:14px}
.pgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}.pgs .pgc{height:34px;margin:0}
.tps{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}.tpm{height:54px;border-radius:10px;font-size:22px;border:1px solid var(--ol)}
.pps{display:flex;gap:8px}.pps button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ol)}.pps .on{border:2px solid var(--ps)}
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}.tabs .chip{padding:5px 10px;font-size:12px}
.srch{display:flex;align-items:center;gap:6px;background:var(--mu);border-radius:16px;padding:6px 10px;margin-bottom:8px}.srch input{border:0;background:none;outline:0;width:100%}
.art{max-width:60%;max-height:60%;object-fit:contain}.tpm .art{max-height:44px;max-width:80%}.nbc .art{max-height:64px}
.sh textarea{border:1px solid var(--ol);background:var(--mu);border-radius:14px;padding:10px;font:inherit;resize:none;outline:0;width:100%}
.shp{width:56px;height:56px;border-radius:16px;background:var(--mu);display:flex;align-items:center;justify-content:center}.shp .i{width:30px;height:30px}
.spn{position:absolute;left:0;top:0;bottom:0;width:11%;border-right:2px solid rgba(255,255,255,.6);box-shadow:inset -3px 0 6px rgba(0,0,0,.08)}
.plq{position:absolute;left:18%;right:9%;bottom:11%;padding:5px 6px;background:rgba(255,255,255,.9);border:1px solid #ebd8d1;border-radius:6px;text-align:center;font-family:Caveat,cursive;font-size:17px;color:#5a3e3a;line-height:1.1;overflow:hidden}
.list .plq{display:none}.nbc .plq{font-size:12px;padding:2px 3px}
.cover.cvprev{width:150px;margin:0 auto;border-radius:6px 14px 14px 6px;overflow:hidden;box-shadow:0 6px 16px var(--sh)}
.mrow{display:flex;align-items:center;gap:12px;text-align:left;padding:12px;border-radius:16px;background:var(--mu);width:100%}.mrow small{display:block;color:var(--bs);font-size:11px}.mrow .i{width:24px;height:24px;color:var(--pt)}
.sh input#cvt{border:1px solid var(--ol);background:var(--mu);border-radius:14px;padding:9px 12px;outline:0;width:100%}.sw1{width:28px;height:28px;border-radius:50%;border:1px solid var(--ol)}
.g .st{height:62px;display:flex;align-items:center;justify-content:center;padding:4px}.g .st img{max-width:100%;max-height:52px}
.g .wsh{height:30px;border-radius:4px;transform:rotate(-4deg);padding:0}.g .frm{padding:6px;background:#fff;border-radius:6px;box-shadow:0 2px 6px var(--sh)}.frm i{display:block;height:46px}
@media (max-width:899px){.side.r .srch{display:none}.side.r .tabs,.side.r .g{flex:none}}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:20;padding:12px}
.sh{background:var(--sf);border-radius:24px;padding:14px 16px;width:min(380px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.sh .bar{margin:0}.sh h4{margin:4px 0 0;display:flex;justify-content:space-between;align-items:center;font-size:13px}
#sv{width:100%;aspect-ratio:220/150;border-radius:14px;touch-action:none;cursor:crosshair}
.hue{-webkit-appearance:none;appearance:none;height:14px;border-radius:7px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);width:100%}
.hue::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid #0006}
.hue::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #0006}
.rg label{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}.rg input{flex:1;accent-color:var(--ps)}.rg output{width:30px;text-align:right}
.hx{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.hx input{width:84px;border:1px solid var(--ol);background:var(--mu);border-radius:12px;padding:6px 10px}
.pvw{width:34px;height:34px;border-radius:50%;border:1px solid var(--ol)}
.sw{display:flex;flex-wrap:wrap;gap:8px;min-height:30px}.sw button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ol)}
.x{font-size:12px;padding:4px 8px;border-radius:12px;color:var(--bs)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--br);color:var(--bg);padding:8px 16px;border-radius:18px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
.ed{flex:1;min-height:0;display:grid;grid-template-columns:130px 1fr 190px;gap:10px;padding:0 12px 12px}
.mid{display:flex;flex-direction:column;min-height:0}
.side{background:var(--sf);border:1px solid var(--ol);border-radius:20px;padding:10px;overflow-y:auto}
.side h4{margin:4px 0 8px;font-size:13px}
.nbc{position:relative;cursor:pointer;height:110px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:6px}
.pgc{display:block;width:100%;height:52px;margin-bottom:8px;border-radius:10px;border:1px solid var(--ol);font-weight:600;color:#5a3e3a}.pgc.on{border:2px solid var(--ps)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.g button{font-size:28px;padding:6px 0;border-radius:12px;background:var(--mu)}
.pn{display:flex;align-items:center;justify-content:center;gap:10px;padding-top:8px}
.panel{margin:0 12px 10px}
@media (max-width:899px){.ed{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}.side.l{display:none}.side.r{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;padding:6px}.side.r h4{display:none}.side.r .g{display:flex;margin:0}.g button{flex:none;width:44px}}
@media (max-width:699px){
#nav{position:fixed;left:0;right:0;bottom:0;z-index:5;width:auto;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--ol);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
#nav .logo,#nav .wide{display:none}
.v-new #nav{display:none}.v-new #main{padding-bottom:30px}
.cols{grid-template-columns:1fr}
}
</style>
</head>

<div class="app"><nav id="nav"></nav><main id="main"></main></div>

function flush(){clearTimeout(st);st=0;try{

/* ---------- paper ---------- */
function drawPaper(x,W,H,type,bg,k=1){
 x.fillStyle=bg;x.fillRect(0,0,W,H);
 const st=32*k,ln='#ebd8d1',dt='#d9c3bb';x.lineWidth=Math.max(1*k,.6);
 if(type==='lined'||type==='grid'){x.strokeStyle=ln;x.beginPath();for(let y=type==='lined'?st*2:st;y<H;y+=st){x.moveTo(0,y);x.lineTo(W,y)}
  if(type==='grid')for(let a=st;a<W;a+=st){x.moveTo(a,0);x.lineTo(a,H)}x.stroke()}
 if(type==='dots'){x.fillStyle=dt;for(let y=st;y<H;y+=st)for(let a=st;a<W;a+=st){x.beginPath();x.arc(a,y,1.6*k+.4,0,7);x.fill()}}
 if(type==='wc'){let r=7;const R=()=>(r=(r*9301+49297)%233280)/233280;x.fillStyle='rgba(229,207,197,.4)';
  for(let i=0;i<140;i++){x.beginPath();x.arc(R()*W,R()*H,(.6+R()*1.6)*Math.max(k,.5),0,7);x.fill()}}
}

  const src=c.toDataURL(f.type==='image/png'&&f.size<400000?'image/png':'image/jpeg',.82);URL.revokeObjectURL(url);
  C.P.stk.push({k:'photo',u:'u'+Date.now(),src,ar:w/h,x:1000,y:C.H/2,z:320,r:0});C.sel=C.P.stk.length-1;A.tool('move');redraw();
  if(src.length>1500000)toast('Gambar besar: penyimpanan browser bisa cepat penuh')};
 im.onerror=()=>toast('Gambar tidak bisa dibaca');im.src=url}
document.addEventListener('change',e=>{if(e.target.id==='imp'){importImg(e.target.files[0]);e.target.value=''}else if(e.target.id==='cvf'){coverFile(e.target.files[0]);e.target.value=''}});
function snap(cv){const o=document.createElement('canvas');o.width=cv.width;o.height=cv.height;o.getContext('2d').drawImage(cv,0,0);return o}
function uiPage(){const sp=$('.pn span');if(sp)sp.textContent=(C.i+1)+' / '+C.nb.pages.length;document.querySelectorAll('.pgc').forEach((b,j)=>b.classList.toggle('on',j===C.i))}
function flip(i,rebuild,done){
 const cv=$('#cv');if(!cv||C.flip||i===C.i)return;
 const dir=i>C.i?1:-1,old=snap(cv);loadPage(i);redraw();const nw=snap(cv);
 const x=cv.getContext('2d'),W=cv.width,H=cv.height,h=W/2,T=650,t0=performance.now();C.flip=1;
 const sh=(a,l,w)=>{x.fillStyle='rgba(90,50,40,'+a+')';x.fillRect(l,0,w,H)};
 function fr(now){
  let t=Math.min(1,(now-t0)/T);t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  const p1=t<.5,u=p1?t*2:(t-.5)*2;
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);
  if(dir>0){x.drawImage(nw,h,0,h,H,h,0,h,H);x.drawImage(old,0,0,h,H,0,0,h,H);
   if(p1){const w=h*(1-u);x.drawImage(old,h,0,h,H,h,0,w,H);sh(.22*u,h,w)}
   else{const w=h*u;x.drawImage(nw,0,0,h,H,h-w,0,w,H);sh(.22*(1-u),h-w,w)}}
  else{x.drawImage(nw,0,0,h,H,0,0,h,H);x.drawImage(old,h,0,h,H,h,0,h,H);
   if(p1){const w=h*(1-u);x.drawImage(old,0,0,h,H,h-w,0,w,H);sh(.22*u,h-w,w)}
   else{const w=h*u;x.drawImage(nw,h,0,h,H,h,0,w,H);sh(.22*(1-u),h,w)}}
  if(now-t0<T)requestAnimationFrame(fr);else{C.flip=0;redraw();if(rebuild)render();else uiPage();if(done)done()}}
 requestAnimationFrame(fr)}
function half(s){const m=IM[s.id];if(s.k==='photo'){const d=dims(s);return[d[0]/2+8,d[1]/2+8]}
 if(s.k==='text'){MC.font=s.z+'px '+fam(s.f);const L=s.t.split('\n');return[Math.max(...L.map(l=>MC.measureText(l).width))/2+6,L.length*s.z*1.15/2+4]}
 if(s.k==='shape')return s.sh==='rect'?[s.z*.7,s.z*.45]:[s.z/2,s.z/2];
 if(s.k==='washi')return[115,28];if(s.k==='frame')return[135,155];if(s.k==='note'||s.k==='gnote')return[155,115];
 if(m&&m.naturalWidth){const f=s.z/Math.max(m.naturalWidth,m.naturalHeight);return[m.naturalWidth*f/2,m.naturalHeight*f/2]}
 return[s.z/2,s.z/2]}
function hpos(s,ix,iy){const h=half(s),m=s.m||1,r=s.r||0,lx=ix*(h[0]+10)*m,ly=iy*(h[1]+10)*m;
 return[s.x+lx*Math.cos(r)-ly*Math.sin(r),s.y+lx*Math.sin(r)+ly*Math.cos(r)]}
function pcfg(){C.nb.cfg=Object.assign({},C.nb.cfg||{w:C.w,h:C.h,dpi:300},{paper:C.paper,bg:C.bg});redraw()}
/* ---------- events ---------- */
const A={
 tab:v=>{S.v=v;render()},
 cs:()=>cpOpen(),cx:()=>document.querySelectorAll('.ov').forEach(e=>e.remove()),
 del:v=>{if(S.del==v){const i=NB.findIndex(n=>n.id==v);if(i>=0)NB.splice(i,1);S.del=0;save()}else S.del=v;grid()},filter:v=>{S.f=v;render()},mode:v=>{S.mode=v;render()},
 open:v=>openNB(NB.find(n=>n.id==v)),back:()=>{S.v='lib';render()},
 size:v=>{if(v==='c')NP.cs=1;else{NP.cs=0;NP.si=+v;const s=SIZES[+v];if(s[2]>s[3])NP.or='L';else if(s[2]<s[3])NP.or='P'}render()},
 paper:v=>{NP.pi=(NP.pi+ +v+5)%5;render()},bg:v=>{NP.bi=+v;render()},tg:v=>{NP.g=v;render()},
 tpl:v=>{NP.ti=NP.ti==v?-1:+v;if(NP.ti>=0)NP.pi=Math.max(0,PAPERS.findIndex(p=>p[0]===TPL[NP.ti][5]));render()},
 ori:v=>{NP.or=v;render()},
 create:()=>{
  let w,h;if(NP.cs){w=Math.min(8192,Math.max(64,+$('#cw').value||1080));h=Math.min(8192,Math.max(64,+$('#ch').value||1080))}else{w=SIZES[NP.si][2];h=SIZES[NP.si][3]}
  const L=Math.max(w,h),Sh=Math.min(w,h),t=TPL[NP.ti];
  const n={id:nid++,t:t?t[0]:'Untitled',cat:t?(t[1]==='Scrapbook'?'Collage':t[1]==='Others'?'Drawing':'Journal'):'Drawing',d:'Just now',recent:1,c:t?[t[3],t[4]]:[BG[NP.bi],'#ffe3e6'],e:t?t[2]:'🎨',
   cfg:{w:NP.or==='L'?L:Sh,h:NP.or==='L'?Sh:L,paper:PAPERS[NP.pi][0],bg:BG[NP.bi],dpi:NP.dpi}};
  NB.forEach(b=>b.recent=0);NB.unshift(n);openNB(n)},
 tool:v=>{C.tool=v;document.querySelectorAll('.tl button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))},
 col:v=>{C.color=v;{const q=C.P.stk[C.sel];if(C.tool==='move'&&q&&(q.k==='shape'||q.k==='text')){q.c=v;redraw()}}if(C.tool==='eraser')A.tool('pen');document.querySelectorAll('.cl button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('#dot').style.background=v},
 undo:()=>{if(!C.undo.length)return;C.redo.push(C.strokes);setStrokes(C.undo.pop())},
 redo:()=>{if(!C.redo.length)return;C.undo.push(C.strokes);setStrokes(C.redo.pop())},
 clear:()=>{if(!C.strokes.length)return;push();setStrokes([])},
 pg:v=>flip(+v),
 pgn:v=>flip(Math.min(C.nb.pages.length-1,Math.max(0,C.i+ +v))),
 addpg:()=>{C.nb.pages.push(newPg());flip(C.nb.pages.length-1,1)},
 stk:v=>{C.P.stk.push({id:v,x:1000,y:C.H/2,z:IZ[v]||150});C.sel=C.P.stk.length-1;A.tool('move');redraw()},
 wa:v=>{C.P.stk.push({k:'washi',c:v,x:1000,y:C.H/3,z:130,r:-.1});C.sel=C.P.stk.length-1;A.tool('move');redraw()},
 fr:v=>{const f=FR[+v];C.P.stk.push({k:f[0],c:f[1],x:1000,y:C.H/2,z:f[0]==='frame'?150:170,r:.03});C.sel=C.P.stk.length-1;A.tool('move');redraw()},
 rt:v=>{C.tab=v;$('.side.r').innerHTML=rpHTML()},
 tp:v=>{const t=TPL[+v];C.paper=t[5];C.bg=t[3];pcfg();render()},
 pp:v=>{C.paper=v;pcfg();render()},
 save:()=>{flush();toast('Tersimpan di browser ini')},
 img:()=>{const i=$('#imp');if(i)i.click()},
 mor:()=>moreOpen(),cvr:()=>cvrOpen(),
 zms:()=>zmOpen(),zd:v=>zoomCenter(Math.min(5,Math.max(.5,(C.z||1)*(+v>0?1.25:.8)))),zp:v=>zoomCenter(+v/100),zr:()=>{C.z=1;C.px=C.py=0;applyView();sharp()},
 xpng:async()=>{A.cx();if(C.flip||C.rec)return;const b=await exportBlob(2000);dl(slug()+'.png',b)},
 xanim:()=>{A.cx();exportAnim()},
 cvimg:()=>{const i=$('#cvf');if(i)i.click()},cvrm:()=>{CV.tmp.img=null;cvPrev()},cvsp:v=>{CV.tmp.spine=v;cvPrev()},
 cvpq:()=>{CV.tmp.plq=!CV.tmp.plq;document.querySelectorAll('.pq').forEach(b=>b.classList.toggle('on',CV.tmp.plq));cvPrev()},
 cvok:()=>{C.nb.cover=CV.tmp;const nt=$('#cvt').value.trim().slice(0,40);if(nt)C.nb.t=nt;C.title=C.nb.t;A.cx();render()},
 txt:()=>txOpen(),shpo:()=>shOpen(),
 tf:v=>{TX.f=v;document.querySelectorAll('.tf').forEach(b=>b.classList.toggle('on',b.dataset.v===v))},
 tok:()=>{const t=$('#tx').value.trim(),z=+$('#tz').value;if(!t){toast('Tulis sesuatu dulu');return}
  if(TX.ed)Object.assign(TX.ed,{t,f:TX.f,z});else{C.P.stk.push({k:'text',t,f:TX.f,c:C.color,z,x:1000,y:C.H/2,r:0});C.sel=C.P.stk.length-1}
  A.tool('move');A.cx();redraw()},
 fm:v=>{C.fill=v==='1';document.querySelectorAll('.fm').forEach(b=>b.classList.toggle('on',b.dataset.v===v))},
 shp:v=>{C.P.stk.push({k:'shape',sh:v,c:C.color,fill:C.fill!==false,z:240,x:1000,y:C.H/2,r:0});C.sel=C.P.stk.length-1;A.tool('move');A.cx();redraw()}
};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a])A[a.dataset.a](a.dataset.v)});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='q'){S.q=t.value;grid()}
 else if(t.id==='sz'){C.size=+t.value;const d=$('#dot');d.style.width=d.style.height=C.size+'px'}
 else if(t.id==='ps'){C.paper=t.value;pcfg();render()}
 else if(t.id==='cvt')cvPrev();
 else if(t.id==='sq'){C.sq=t.value;$('.side.r').innerHTML=rpHTML();const i=$('#sq');i.focus();i.setSelectionRange(i.value.length,i.value.length)}
 else if(t.id==='dpi')NP.dpi=+t.value;
});
render();
